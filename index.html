<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>To-Do List</h1>
      <p class="subtitle">Plan your day, one task at a time.</p>
    </header>

    <!-- Form for adding a new task -->
    <form id="taskForm" class="task-form" novalidate>
      <input id="taskInput" type="text" placeholder="What do you need to do?" maxlength="120" aria-label="Task">
      <select id="priorityInput" aria-label="Priority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <input id="dueInput" type="date" aria-label="Due date">
      <button type="submit">Add</button>
    </form>
    <p id="formError" class="form-error" role="alert"></p>

    <!-- Search and filter -->
    <div class="toolbar">
      <input id="searchInput" type="search" placeholder="Search tasks..." aria-label="Search tasks">
      <div class="filters" role="group" aria-label="Filter tasks">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="active">Active</button>
        <button class="filter" data-filter="done">Done</button>
      </div>
    </div>

    <!-- The tasks are drawn here by script.js -->
    <ul id="taskList" class="task-list"></ul>
    <p id="emptyMessage" class="empty">No tasks yet. Add one above!</p>

    <footer class="app-footer">
      <span id="counter">0 tasks left</span>
      <button id="clearDone" class="link-button">Clear completed</button>
    </footer>
  </main>

  <p class="credit">Tasks are saved in your browser</p>

  <script src="script.js"></script>
</body>
</html>
